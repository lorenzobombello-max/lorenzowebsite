<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Aanvraag goedgekeurd | Lorenzo Bombello</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f3f5f7;
        --surface: #ffffff;
        --text: #17202a;
        --muted: #5d6873;
        --accent: #ad6b0b;
        --success: #2f7d46;
        --border: #d8dde2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top right, rgba(173, 107, 11, 0.12), transparent 34rem),
          var(--background);
        color: var(--text);
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }

      main {
        width: min(100%, 650px);
        padding: clamp(30px, 6vw, 54px);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 18px 55px rgba(23, 32, 42, 0.12);
        text-align: center;
      }

      .status-icon {
        width: 68px;
        height: 68px;
        display: grid;
        place-items: center;
        margin: 0 auto 24px;
        border-radius: 50%;
        background: var(--success);
        color: #ffffff;
        font-size: 38px;
        line-height: 1;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(1.7rem, 5vw, 2.4rem);
        line-height: 1.15;
      }

      p {
        margin: 0 auto;
        max-width: 48ch;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
      }

      .close-status {
        margin-top: 24px;
        font-size: 0.98rem;
      }

      .close-status strong {
        color: var(--text);
      }

      .close-fallback {
        display: none;
        margin-top: 10px;
        font-size: 0.92rem;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #12171c;
          --surface: #1b2229;
          --text: #f5f7f9;
          --muted: #c6cdd3;
          --border: #35404a;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status-icon" aria-hidden="true">✓</div>
      <h1>Aanvraag goedgekeurd</h1>
      <p>
        De tijdelijke beveiligde downloadlinks zijn succesvol naar de
        aanvrager verzonden.
      </p>
      <p class="close-status" id="close-status" aria-live="polite">
        Dit tabblad sluit automatisch over
        <strong id="close-countdown">5</strong> seconden.
      </p>
      <p class="close-fallback" id="close-fallback">
        De aanvraag is verwerkt. Sluit dit tabblad met Ctrl+W om terug te keren
        naar je e-mail.
      </p>
    </main>
    <script>
      (() => {
        const countdown = document.getElementById("close-countdown");
        const closeStatus = document.getElementById("close-status");
        const closeFallback = document.getElementById("close-fallback");
        let remaining = 5;

        const timer = window.setInterval(() => {
          remaining -= 1;
          countdown.textContent = String(Math.max(remaining, 0));

          if (remaining === 0) {
            window.clearInterval(timer);
            closeStatus.textContent = "Dit tabblad wordt gesloten…";
            window.close();

            window.setTimeout(() => {
              closeStatus.style.display = "none";
              closeFallback.style.display = "block";
            }, 500);
          }
        }, 1000);
      })();
    </script>
  </body>
</html>
